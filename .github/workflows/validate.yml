name: Validate XML packaging and regulatory register structure
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name != 'push' || github.ref != 'refs/heads/maintenance/research-reliability-2026-09-23'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_prompts.py
      - run: python tools/check_register.py
  initialize-xml:
    if: github.event_name == 'push' && github.ref == 'refs/heads/maintenance/research-reliability-2026-09-23'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/research-reliability-2026-09-23
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_prompts.py --write
      - run: python tools/build_prompts.py
      - run: python tools/check_register.py
      - name: Commit generated XML and documentation fixes to maintenance branch only
        run: |
          test "${GITHUB_REF}" = "refs/heads/maintenance/research-reliability-2026-09-23"
          git add -- generated PROMPT_LIBRARY.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Generate 52 validated XML prompts and repair catalogue paths'
            git push origin HEAD:maintenance/research-reliability-2026-09-23
          fi
